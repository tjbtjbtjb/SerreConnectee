<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	ServerName greenhouse.physique.univ-paris-diderot.fr
	ServerAlias greenhouse

	# Redirect all HTTP to HTTPS
	RewriteEngine On
	RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	ServerName greenhouse.physique.univ-paris-diderot.fr
	ServerAlias greenhouse
	DocumentRoot /var/www/html

	SSLEngine on

	ErrorLog    ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	ProxyPreserveHost On
	ProxyPass /grafana http://localhost:3000/grafana
	ProxyPassReverse /grafana http://localhost:3000/grafana
	SSLCertificateFile /etc/letsencrypt/live/greenhouse.physique.univ-paris-diderot.fr/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/greenhouse.physique.univ-paris-diderot.fr/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
